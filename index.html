<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一起听看">
<meta name="theme-color" content="#1D171C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>一起听看</title>
<style>
  /* 和安卓版房间一样的可可夜色：底色、卡片、玫瑰色强调 */
  :root {
    --bg: #1D171C; --surface: #292127; --surface-2: #352B33; --line: #41353E;
    --fg: #F3E9E8; --muted: #B9A6AA; --rose: #E9A5B2; --rose-deep: #B46B7A; --peach: #D1A191;
    --heart: #F05A67; --ok: #8FD3A8;
    --font: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: var(--fg); }
  [hidden] { display: none !important; }

  /* ---- 加入页 ---- */
  #join { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding: calc(env(safe-area-inset-top) + 32px) 22px calc(env(safe-area-inset-bottom) + 32px);
    max-width: 460px; margin: 0 auto; }
  #join h1 { margin: 0; font-size: 40px; letter-spacing: 2px; }
  #join h1 span { color: var(--rose); }
  #join .sub { margin: -8px 0 6px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 17px; outline: none; }
  .field input:focus { border-color: var(--rose); }
  #code { letter-spacing: 3px; text-transform: uppercase; font-size: 20px; }
  .primary { background: linear-gradient(120deg, var(--rose-deep), var(--peach)); color: #fff; border-radius: 18px; padding: 15px; font-size: 17px; font-weight: 600; }
  .primary:disabled { opacity: .5; }
  .tip { font-size: 13px; color: var(--muted); line-height: 1.6; background: var(--surface); border-radius: 16px; padding: 12px 14px; }

  /* ---- 房间 ---- */
  #room { height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  #backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(30px) saturate(1.2); opacity: .55; transform: scale(1.2); z-index: 0; }
  #backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(29,23,28,.35), rgba(29,23,28,.85) 55%, var(--bg)); }
  #room > *:not(#backdrop) { position: relative; z-index: 1; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 16px 6px; }
  .topbar .titles { flex: 1; min-width: 0; }
  .topbar .t1 { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .t2 { font-size: 12px; color: var(--muted); }
  .iconbtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: rgba(255,255,255,.06); font-size: 18px; flex: none; }
  svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; display: block; }
  .hero { display: flex; gap: 16px; align-items: center; padding: 6px 20px 2px; }
  .cover { width: 108px; height: 108px; border-radius: 20px; flex: none; background: linear-gradient(135deg, var(--rose-deep), var(--peach)); background-size: cover; background-position: center; display: grid; place-items: center; color: #F6ECEC; box-shadow: 0 10px 30px rgba(180,107,122,.35); }
  .cover svg.i { width: 44px; height: 44px; }
  .meta { min-width: 0; flex: 1; }
  .song { font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-size: 12px; }
  .tag { padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted); }
  .tag.src { background: var(--rose-deep); color: #fff; }
  #status { margin: 6px 20px 0; font-size: 13px; color: var(--rose); min-height: 18px; }
  #tapToPlay { margin: 8px 20px 0; }
  .lyrics { height: 84px; overflow: hidden; text-align: center; margin: 6px 20px 0; mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
  .lyrics .line { font-size: 14px; color: var(--muted); line-height: 1.5; min-height: 21px; }
  .lyrics .line.now { color: var(--fg); font-size: 16px; font-weight: 600; }
  .lyrics .tr { font-size: 12px; color: var(--rose); min-height: 18px; }
  .progress { padding: 8px 24px 0; }
  .bar { position: relative; height: 28px; touch-action: none; }
  .bar .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); }
  .bar .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--rose); }
  .bar .knob { position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: var(--rose); box-shadow: 0 0 0 4px rgba(233,165,178,.2); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: space-between; align-items: center; padding: 2px 26px 12px; }
  .play { width: 66px; height: 66px; border-radius: 33px; background: linear-gradient(135deg, var(--rose-deep), var(--peach)); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(180,107,122,.35); }
  .play svg.i { width: 32px; height: 32px; }
  .ctl { width: 46px; height: 46px; display: grid; place-items: center; color: var(--fg); border-radius: 23px; }
  .ctl svg.i { width: 30px; height: 30px; }
  .ctl.small svg.i { width: 24px; height: 24px; }
  .ctl.dim { color: var(--muted); }
  /* 两个人的头像，中间一颗心 */
  .pair { display: flex; justify-content: center; align-items: center; padding: 2px 0 8px; }
  .pair .avatar { width: 46px; height: 46px; font-size: 18px; border: 3px solid rgba(29,23,28,.9); }
  .pair .avatar + .avatar { margin-left: -10px; }
  .pair .mid { width: 26px; height: 26px; margin: 0 -9px; z-index: 1; border-radius: 13px; background: #1D171C; display: grid; place-items: center; color: var(--heart); }
  .pair .mid svg.i { width: 15px; height: 15px; }
  .pair .avatar.wait { background: rgba(255,255,255,.08); color: var(--muted); border-style: dashed; border-color: var(--line); }
  /* 歌名下面一排圆按钮：飘心、定时、歌词 */
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .round { position: relative; width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.07); display: grid; place-items: center; color: var(--fg); }
  .round.heart { color: var(--heart); }
  .round.on { background: var(--rose-deep); color: #fff; }
  .round .lbl { position: absolute; top: 100%; left: 50%; transform: translate(-50%, 2px); font-size: 10px; color: var(--rose); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* 面板展开时，上面收成一条迷你播放条 */
  .minibar { display: none; align-items: center; gap: 12px; padding: 4px 16px 12px; }
  .minibar .cover { width: 52px; height: 52px; border-radius: 12px; box-shadow: none; }
  .minibar .cover svg.i { width: 24px; height: 24px; }
  .minibar .meta .song { font-size: 17px; }
  .minibar .play { width: 46px; height: 46px; box-shadow: none; }
  .minibar .play svg.i { width: 24px; height: 24px; }
  #room.expanded .full { display: none !important; }
  #room.expanded .minibar { display: flex; }

  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-radius: 26px 26px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  .tabs { display: flex; gap: 6px; padding: 12px 10px 8px; align-items: center; }
  .tabs button[data-tab] { flex: 1; min-width: 0; padding: 7px 0 6px; border-radius: 18px; background: rgba(255,255,255,.05); color: var(--muted); font-size: 12px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button[data-tab] svg.i { width: 20px; height: 20px; }
  .tabs button.on { background: linear-gradient(120deg, var(--rose-deep), var(--peach)); color: #fff; }
  .tabs .tabicon { width: 36px; height: 44px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .tabs .dot { position: absolute; top: 5px; right: 10px; width: 8px; height: 8px; border-radius: 4px; background: var(--heart); }
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 12px 8px; }
  .msg { display: flex; gap: 8px; margin: 10px 2px; max-width: 86%; align-items: flex-start; }
  .msg .avatar { width: 34px; height: 34px; font-size: 14px; }
  .msg .body { min-width: 0; display: flex; flex-direction: column; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .msg .bubble { background: var(--surface-2); padding: 9px 13px; border-radius: 4px 16px 16px 16px; line-height: 1.45; word-break: break-word; }
  .msg.mine { margin-left: auto; justify-content: flex-end; }
  .msg.mine .body { align-items: flex-end; }
  .msg.mine .bubble { background: linear-gradient(120deg, var(--rose-deep), var(--peach)); color: #fff; border-radius: 16px 4px 16px 16px; }
  .sys { text-align: center; font-size: 12px; color: var(--muted); margin: 8px auto; background: rgba(255,255,255,.05); border-radius: 999px; padding: 4px 12px; width: fit-content; max-width: 92%; }
  .inputrow { display: flex; gap: 8px; padding: 6px 12px 10px; align-items: center; }
  .inputrow input { flex: 1; min-width: 0; background: var(--surface-2); border: 0; border-radius: 22px; padding: 12px 16px; outline: none; font-size: 16px; }
  .inputrow button { padding: 0 16px; height: 44px; border-radius: 22px; background: linear-gradient(120deg, var(--rose-deep), var(--peach)); color: #fff; flex: none; }
  .inputrow button.send { width: 44px; padding: 0; display: grid; place-items: center; }
  .srcpick { display: flex; gap: 8px; padding: 2px 12px 0; }
  .srcpick button { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 13px; }
  .srcpick button.on { background: var(--rose-deep); color: #fff; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 14px; }
  .row.now { background: rgba(233,165,178,.12); }
  .row .thumb { width: 42px; height: 42px; border-radius: 10px; flex: none; background: var(--surface-2); background-size: cover; background-position: center; }
  .row .info { flex: 1; min-width: 0; }
  .row .a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .b { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .act { padding: 7px 11px; border-radius: 12px; background: rgba(255,255,255,.07); font-size: 13px; flex: none; }
  .row .act.main { background: var(--rose-deep); color: #fff; }
  .empty { color: var(--muted); text-align: center; padding: 28px 12px; font-size: 14px; line-height: 1.6; }
  .avatar { width: 40px; height: 40px; border-radius: 20px; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--rose-deep), var(--peach)); background-size: cover; background-position: center; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted); margin-left: 6px; }
  .lyrics { cursor: pointer; }
  /* 设置：音量、翻译、亮屏、网络 */
  .setrow { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .setrow > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .setrow small { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .setrow input[type=range] { flex: 1.4; accent-color: var(--rose); }
  .switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .2s; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; transition: transform .2s; }
  .switch:checked { background: var(--rose-deep); }
  .switch:checked::after { transform: translateX(18px); }
  .sheet .closebtn { width: 100%; margin-top: 14px; padding: 13px 0; border-radius: 14px; background: rgba(255,255,255,.06); }
  .chip { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 13px; flex: none; }
  /* 我的网易云歌单 */
  .libcard { margin: 6px 12px; padding: 14px; border-radius: 18px; background: var(--surface-2); line-height: 1.6; font-size: 14px; }
  .libcard h4 { margin: 0 0 6px; font-size: 16px; }
  .libcard ol { margin: 4px 0 10px; padding-left: 20px; color: var(--muted); font-size: 13px; }
  .libcard .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .libhead { display: flex; align-items: center; gap: 8px; padding: 4px 12px 6px; }
  .libhead .grow { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .libhead .grow small { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .libhead .back { width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.06); display: grid; place-items: center; flex: none; }
  .libmsg { margin: 0 12px 6px; font-size: 13px; color: var(--rose); }
  .more { display: block; margin: 8px auto 4px; }
  /* 整页歌词 */
  #lyricsFull { position: fixed; inset: 0; z-index: 30; background: #140f13; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) 0 env(safe-area-inset-bottom); }
  .lf-top { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; }
  .lf-top .ttl { flex: 1; min-width: 0; text-align: center; }
  .lf-top .ttl div:first-child { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-top .ttl div:last-child { font-size: 12px; color: var(--muted); }
  .lf-top .pill { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 13px; color: var(--muted); }
  .lf-top .pill.on { background: var(--rose-deep); color: #fff; }
  .lf-scroll { flex: 1; overflow-y: auto; padding: 40vh 24px; text-align: center; scroll-behavior: smooth;
    mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  .lf-line { padding: 9px 0; color: var(--muted); font-size: 18px; line-height: 1.45; transition: color .25s, transform .25s; }
  .lf-line .tr { display: block; font-size: 14px; margin-top: 2px; color: rgba(233,165,178,.75); }
  .lf-line.now { color: var(--fg); font-weight: 700; transform: scale(1.06); }
  .lf-line.now .tr { color: var(--rose); }
  .machine { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; margin-left: 6px; }
  /* 列表工具条、撤销 */
  .toolbar { display: flex; gap: 8px; padding: 2px 12px 4px; flex-wrap: wrap; align-items: center; }
  .toolbar .chip { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 13px; }
  .toolbar .chip.on { background: var(--rose-deep); color: #fff; }
  .toolbar .grow { flex: 1; font-size: 13px; color: var(--muted); }
  .toolbar .danger { color: #F2A3A3; }
  .row .mini { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.06); flex: none; display: grid; place-items: center; color: var(--muted); }
  .row .mini svg.i { width: 18px; height: 18px; }
  .undo { display: flex; align-items: center; gap: 10px; margin: 4px 12px 8px; padding: 10px 14px; border-radius: 14px; background: var(--fg); color: var(--bg); font-size: 14px; }
  .undo span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .undo button { color: var(--rose-deep); font-weight: 700; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 6px; }
  .chips button { padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 13px; }
  /* 底部弹出的选项 */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .sheet .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .sheet .opts button { padding: 13px 0; border-radius: 14px; background: rgba(255,255,255,.06); }
  .sheet .opts button.wide { grid-column: span 3; }
  .sheet .opts button.warn { color: #F2A3A3; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 50; max-width: 86%; text-align: center; transition: opacity .3s; }
  .floating-heart { position: fixed; bottom: 40%; font-size: 30px; pointer-events: none; animation: rise 2.4s ease-out forwards; z-index: 40; }
  @keyframes rise { from { transform: translateY(0) scale(.8); opacity: 1; } to { transform: translateY(-260px) scale(1.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .floating-heart { animation-duration: .01s; } }
</style>
</head>
<body>

<div id="join">
  <h1>一起<span>听</span>看</h1>
  <p class="sub">网页版 · 进入安卓那边开的房间，一起听歌、聊天</p>
  <div class="field">
    <label for="nick">你的名字（TA 看到的）</label>
    <input id="nick" maxlength="20" placeholder="比如：小花" autocomplete="nickname">
  </div>
  <div class="field">
    <label for="code">房间码</label>
    <input id="code" maxlength="9" placeholder="ABCD-2345" autocomplete="off" autocapitalize="characters" inputmode="text">
  </div>
  <button id="joinBtn" class="primary">进入房间</button>
  <div class="tip">
    在 iPhone 上：用 Safari 打开，点下面的「分享」→「添加到主屏幕」，以后就能像 App 一样从桌面打开。<br>
    点歌、歌词、网易云登录由房间里的安卓手机代为完成；切到后台或锁屏后连接断了，回来会马上自动重连、对齐。
  </div>
</div>

<div id="room" hidden>
  <div id="backdrop"></div>
  <div class="topbar">
    <div class="titles">
      <div class="t1" id="roomTitle">一起听</div>
      <div class="t2" id="roomSub"></div>
    </div>
    <button class="iconbtn" id="inviteBtn" data-icon="personAdd" aria-label="邀请 TA 进来"></button>
    <button class="iconbtn" id="leaveBtn" data-icon="logout" aria-label="离开房间"></button>
  </div>
  <div class="pair full" id="pair"></div>
  <div class="hero full">
    <div class="cover" id="cover"></div>
    <div class="meta">
      <div class="song" id="song">还没有歌</div>
      <div class="artist" id="artist">去「点歌」加几首吧</div>
      <div class="tags" id="tags"></div>
      <div class="actions">
        <button class="round heart" id="heartBtn" data-icon="heart" aria-label="飘心"></button>
        <button class="round" id="sleepBtn" data-icon="moon" aria-label="睡眠定时"><span class="lbl" id="sleepLbl"></span></button>
        <button class="round" id="lyricsBtn" data-icon="lyrics" aria-label="整页歌词"></button>
      </div>
    </div>
  </div>
  <div class="minibar">
    <div class="cover" id="miniCover"></div>
    <div class="meta">
      <div class="song" id="miniSong"></div>
      <div class="artist" id="miniArtist"></div>
    </div>
    <button class="play" id="miniPlay" aria-label="播放/暂停"></button>
    <button class="ctl small" id="miniNext" data-icon="next" aria-label="下一首"></button>
  </div>
  <div id="status"></div>
  <button id="tapToPlay" class="primary" hidden>点一下开始播放</button>
  <div class="lyrics full" id="lyrics" role="button" aria-label="看整页歌词"></div>
  <div class="progress full">
    <div class="bar" id="bar"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="controls full">

/* ---------------- 加密：和安卓版 RoomCrypto 一样 ---------------- */
async function pbkdf2(password, salt, bits) {
  const key = await crypto.subtle.importKey('raw', te.encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: te.encode(salt), iterations: 20000 }, key, bits));
}
async function roomCrypto(code) {
  const norm = normalizeCode(code);
  const topicId = hex(await pbkdf2(norm, 'ltapp-topic-v1', 128));
  const key = await crypto.subtle.importKey('raw', await pbkdf2(norm, 'ltapp-key-v1', 256), 'AES-GCM', false, ['encrypt', 'decrypt']);
  return {
    topicId,
    async encrypt(plain) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      return concat(iv, new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain)));
    },
    async decrypt(data) {
      if (data.length < 13) return null;
      try { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12))); }
      catch (e) { return null; }
    },
  };
}
/* 大于 2KB 的消息安卓那边会 gzip：收的时候解开，发的时候也压一下 */
async function unpack(b) {
  if (b.length >= 2 && b[0] === 0x1f && b[1] === 0x8b) {
    if (typeof DecompressionStream === 'undefined') return null;
    return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  return b;
}
async function pack(b) {
  if (b.length < 2048 || typeof CompressionStream === 'undefined') return b;
  const gz = new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  return gz.length < b.length ? gz : b;
}

/* ---------------- 极简 MQTT 3.1.1 客户端（WebSocket） ---------------- */
class Mqtt {
  constructor(url, clientId, opts) { this.url = url; this.clientId = clientId; this.opts = opts || {}; this.pid = 1; this.buf = new Uint8Array(0); this.closed = false; }
  static str(s) { const b = te.encode(s); const out = new Uint8Array(2 + b.length); out[0] = b.length >> 8; out[1] = b.length & 255; out.set(b, 2); return out; }
  static bin(b) { const out = new Uint8Array(2 + b.length); out[0] = b.length >> 8; out[1] = b.length & 255; out.set(b, 2); return out; }
  static packet(type, flags, body) {
    const len = []; let n = body.length;
    do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
    const out = new Uint8Array(1 + len.length + body.length); out[0] = (type << 4) | flags; out.set(len, 1); out.set(body, 1 + len.length); return out;
  }
  connect() {
    return new Promise((resolve, reject) => {
      let ws;
      try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { reject(e); return; }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const timer = setTimeout(() => { reject(new Error('连接超时')); try { ws.close(); } catch (e) {} }, 8000);
      ws.onopen = () => {
        const will = this.opts.will;
        let flags = 0x02; // clean session
        // 心跳 60 秒：iPhone 在后台会放慢定时器，留足余量，服务器不会太早把我们判成离开
        const parts = [Mqtt.str('MQTT'), new Uint8Array([4, 0, 0, 60])];
        const payload = [Mqtt.str(this.clientId)];
        if (will) { flags |= 0x04 | (1 << 3) | (will.retain ? 0x20 : 0); payload.push(Mqtt.str(will.topic), Mqtt.bin(will.payload)); }
        parts[1][1] = flags;
        const body = [...parts, ...payload].reduce(concat, new Uint8Array(0));
        ws.send(Mqtt.packet(1, 0, body));
      };
      ws.onmessage = ev => this.onData(new Uint8Array(ev.data), () => { clearTimeout(timer); resolve(); });
      ws.onerror = () => {};
      ws.onclose = () => {
        clearTimeout(timer); clearInterval(this.pinger);
        if (!this.connected) reject(new Error('连不上服务器'));
        this.connected = false;
        if (!this.closed && this.opts.onClose) this.opts.onClose();
      };
    });
  }
  onData(chunk, onConnack) {
    this.lastRx = now();
    this.buf = concat(this.buf, chunk);
    while (this.buf.length >= 2) {
      let mult = 1, len = 0, i = 1, byte;
      do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mult; mult *= 128; } while (byte & 128);
      if (this.buf.length < i + len) return;
      const head = this.buf[0], body = this.buf.slice(i, i + len);
      this.buf = this.buf.slice(i + len);
      const type = head >> 4;
      if (type === 2) { // CONNACK
        if (body[1] !== 0) { try { this.ws.close(); } catch (e) {} return; }
        this.connected = true;
        this.pinger = setInterval(() => this.send(new Uint8Array([0xC0, 0])), 20000);
        onConnack();
      } else if (type === 3) { // PUBLISH
        const qos = (head >> 1) & 3, retain = head & 1;
        const tl = (body[0] << 8) | body[1];
        const topic = td.decode(body.slice(2, 2 + tl));
        let p = 2 + tl;
        if (qos > 0) { const id = (body[p] << 8) | body[p + 1]; p += 2; this.send(Mqtt.packet(4, 0, new Uint8Array([id >> 8, id & 255]))); }
        if (this.opts.onMessage) this.opts.onMessage(topic, body.slice(p), !!retain);
      }
    }
  }
  send(b) { if (this.ws && this.ws.readyState === 1) this.ws.send(b); }
  nextId() { this.pid = this.pid % 65000 + 1; return this.pid; }
  subscribe(topics, qos = 1) {
    const id = this.nextId();
    const body = [new Uint8Array([id >> 8, id & 255]), ...topics.flatMap(t => [Mqtt.str(t), new Uint8Array([qos])])].reduce(concat, new Uint8Array(0));
    this.send(Mqtt.packet(8, 2, body));
  }
  publish(topic, payload, { qos = 0, retain = false } = {}) {
    const parts = [Mqtt.str(topic)];
    if (qos > 0) { const id = this.nextId(); parts.push(new Uint8Array([id >> 8, id & 255])); }
    parts.push(payload);
    this.send(Mqtt.packet(3, (qos << 1) | (retain ? 1 : 0), parts.reduce(concat, new Uint8Array(0))));
  }
  close() { this.closed = true; clearInterval(this.pinger); try { this.send(new Uint8Array([0xE0, 0])); this.ws.close(); } catch (e) {} }
  ping() { this.send(new Uint8Array([0xC0, 0])); }
  /** 连接“假死”（网络切换、从后台回来）：不等浏览器慢慢发现，直接当断线处理，马上重连。 */
  kill() {
    if (this.closed) return;
    this.closed = true; this.connected = false; clearInterval(this.pinger);
    const ws = this.ws; if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch (e) {} }
    if (this.opts.onClose) this.opts.onClose();
  }
}

/* ---------------- 房间 ---------------- */
const S = {
  code: '', crypto: null, base: '', mqtt: null, broker: '',
  clientId: store('lt.clientId') || (() => { const id = rand(10); store('lt.clientId', id); return id; })(),
  myId: '', name: '', joinedAt: 0,
  playback: null, queue: [], members: {}, chat: [],
  clock: { hostId: '', offset: null, samples: [] },
  lyrics: {}, lyricsKey: '', searchId: '', source: 'netease', tab: 'chat',
  unlocked: false, loadedKey: '', loadedUrl: '', lastSeek: 0, leaving: false,
};

async function sendEncrypted(topic, obj, opts) {
  const plain = await pack(te.encode(JSON.stringify(obj)));
  S.mqtt.publish(topic, await S.crypto.encrypt(plain), opts);
}
function bus(msg) { return sendEncrypted(S.base + '/bus', Object.assign({ from: S.myId, name: S.name, ts: Date.now() }, msg), { qos: 1 }); }
function cmd(name, extra) { return bus(Object.assign({ type: 'cmd', cmd: name }, extra || {})); }
function me() { return { id: S.myId, name: S.name, joinedAt: S.joinedAt, sources: [], voiceVersion: 3, web: true }; }

/* 每台手机按“比最快那一次往返”估计和房主的时钟差（和安卓版一样） */
// 安卓那边的时间字段是整数（毫秒），带小数会解析失败
function ping() { bus({ type: 'ping', t0: Math.round(now()) }); }
function pingBurst() { for (let i = 0; i < 5; i++) setTimeout(ping, i * 300); }

async function onMessage(topic, payload) {
  const rel = topic.slice(S.base.length + 1);
  if (rel.startsWith('v/')) return; // 语音：网页版第二期再做
  if (payload.length === 0) {
    // 自己的在线状态被清掉了（上一条断掉的连接到时间了，服务器替它发了“离开”）：马上补回来
    if (rel === 'm/' + S.myId) { if (!S.leaving && S.mqtt && S.mqtt.connected) publishPresence(); return; }
    if (rel.startsWith('m/')) { delete S.members[rel.slice(2)]; renderMembers(); renderTop(); }
    return;
  }
  const plain = await S.crypto.decrypt(payload);
  if (!plain) return;
  const bytes = await unpack(plain);
  if (!bytes) return;
  let obj; try { obj = JSON.parse(td.decode(bytes)); } catch (e) { return; }
  if (rel === 'state') onState(obj);
  else if (rel === 'queue') { S.queue = obj.items || []; renderQueue(); }
  else if (rel === 'bus') onBus(obj);
  else if (rel.startsWith('m/')) { if (obj.id === rel.slice(2)) { S.members[obj.id] = obj; renderMembers(); renderTop(); } }
  else if (rel === 'bg') { if (obj.image) $('backdrop').style.backgroundImage = `url(data:image/jpeg;base64,${obj.image})`; }
}

// 安卓那边等于默认值的字段不发：暂停时没有 paused 字段（默认就是暂停），所以这里先补上默认值
const PLAYBACK_DEFAULTS = { kind: 'music', paused: true, mode: 'list' };
function onState(raw) {
  const pb = Object.assign({}, PLAYBACK_DEFAULTS, raw);
  const old = S.playback;
  S.playback = pb;
  if (!old || old.hostId !== pb.hostId) { S.clock = { hostId: pb.hostId, offset: null, samples: [] }; pingBurst(); renderMembers(); }
  if (!old || (old.track && old.track.key) !== (pb.track && pb.track.key)) renderSong();
  if (pb.track && pb.track.key && !S.lyrics[pb.track.key] && S.lyricsKey !== pb.track.key) {
    S.lyricsKey = pb.track.key;
    bus({ type: 'needLyrics', tracks: [pb.track] });
  }
  renderStatus(); renderQueue(); renderPlayButton(); renderMode(); renderSleep();
  if (!old || (old.track && old.track.key) !== (pb.track && pb.track.key)) updateMediaSession();
}

function onBus(m) {
  switch (m.type) {
    case 'chat': addChat({ id: m.id, from: m.from, name: m.name, text: m.text || '', ts: m.ts }); break;
    case 'sys': addChat({ id: m.id, sys: true, text: m.text || '', ts: m.ts }); break;
    case 'pong':
      if (m.to === S.myId && S.playback && m.from === S.playback.hostId) {
        const t2 = now(), rtt = t2 - m.t0;
        if (rtt < 0 || rtt > 10000) return;
        if (S.clock.hostId !== m.from) S.clock = { hostId: m.from, offset: null, samples: [] };
        S.clock.samples.push({ rtt, offset: m.t1 + rtt / 2 - t2 });
        if (S.clock.samples.length > 10) S.clock.samples.shift();
        S.clock.offset = S.clock.samples.reduce((a, b) => (b.rtt < a.rtt ? b : a)).offset;
      }
      break;
    case 'react': if (m.from !== S.myId) floatHeart(m.text || '❤️'); break;
    case 'searchResult': if (m.to === S.myId && m.id === S.searchId) renderResults(m.tracks || []); break;
    case 'lyrics':
      if (m.to === S.myId && m.key) { try { S.lyrics[m.key] = parseLyrics(JSON.parse(m.text || '{}')); } catch (e) {} }
      break;
    case 'neResult': case 'playlistsResult': case 'playlistResult': if (m.to === S.myId) onHostReply(m); break;
  }
}

/* ---------------- 加入 / 离开 ---------------- */
/* 不知道房间在哪台服务器上：几个入口同时问，先找到房间的那条连接就留下来用（同一集群的两个入口，谁快用谁） */

function newClient(url, onMessage, onClose) {
  return new Mqtt(url, 'ltw-' + S.myId + '-' + rand(3), {
    will: { topic: S.base + '/m/' + S.myId, payload: new Uint8Array(0), retain: true },
    onMessage, onClose,

}
async function findRoom(base) {
  return new Promise(resolve => {
    let done = false; const tried = [];
    const finish = winner => {
      if (done) return; done = true;
      tried.forEach(t => { if (t !== winner) try { t.client.close(); } catch (e) {} });
      resolve(winner);
    };
    // 没找到房间（还没人进来）：用最先连上的那条
    const fallback = () => tried.filter(t => t.client.connected).sort((a, b) => a.connectedAt - b.connectedAt)[0] || null;
    let pending = ENDPOINTS.length;
    ENDPOINTS.forEach(ep => {
      const entry = { ep, buffer: [], client: null, connectedAt: Infinity };
      entry.client = newClient(ep.url, async (topic, payload) => {
        if (entry.handler) return entry.handler(topic, payload);
        entry.buffer.push([topic, payload]);
        if (!done && topic.startsWith(base + '/m/') && payload.length && await S.crypto.decrypt(payload)) finish(entry);
      }, () => entry.onClose && entry.onClose());
      tried.push(entry);
      entry.client.connect().then(() => {
        entry.connectedAt = now();
        entry.client.subscribe(roomTopics(base));
        setTimeout(() => { if (--pending === 0 && !done) finish(fallback()); }, 4000);
      }).catch(() => { if (--pending === 0 && !done) finish(fallback()); });
    });
    setTimeout(() => finish(fallback()), 12000);
  });
}

async function join() {

  const code = normalizeCode($('code').value);

  if (code.length < 4) { toast('房间码不对'); $('code').focus(); return; }

    const entry = await findRoom(S.base);

    useConnection(entry.client, entry.ep);

function useConnection(client, ep) {

/* 断线重连：马上试一次，同一集群的几个入口一起连，谁先连上用谁；之后 1、2、4、8 秒再试 */
let reconnecting = false, wakeReconnect = null;
async function reconnect() {

  const eps = ENDPOINTS.filter(e => e.cluster === S.ep.cluster);
  for (let attempt = 0; !S.leaving; attempt++) {
    if (attempt > 0) await new Promise(r => { wakeReconnect = r; setTimeout(r, Math.min(8000, 1000 * 2 ** (attempt - 1))); });
    wakeReconnect = null;
    if (navigator.onLine === false) continue;
    const won = await raceConnect(eps);
    if (!won || S.leaving) { if (won) won.client.close(); continue; }
    useConnection(won.client, won.ep);
    won.client.subscribe(roomTopics(S.base));
    await publishPresence(); pingBurst();
    reconnecting = false; renderStatus(); renderNet();
    return;
  }

}

/**

/* ---------------- 播放：跟着房间走 ---------------- */
const audio = $('player');
function unlockAudio() {
  if (S.unlocked) return;
  // 一小段静音：在用户点击里播一下，之后就能自动播放了
  audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  const p = audio.play();
  if (p && p.then) p.then(() => { audio.pause(); S.unlocked = true; }).catch(() => {});
  else S.unlocked = true;
}
function desiredUrl(pb) {
  const t = pb.track; if (!t) return null;
  if (t.source === 'netease' || t.source === 'qq') return pb.url ? https(pb.url) : null;
  if (t.source === 'url' && !t.video) return https(t.id);
  return null;
}
function syncPlayer() {

  if (!pb || !pb.track) { if (S.loadedKey) { audio.pause(); audio.removeAttribute('src'); audio.load(); S.loadedKey = ''; S.loadedUrl = ''; } return; }
  const url = desiredUrl(pb);
  if (!url) { if (!audio.paused) audio.pause(); return; }
  if (S.loadedKey !== pb.track.key || S.loadedUrl !== url) { S.loadedKey = pb.track.key; S.loadedUrl = url; audio.src = url; audio.load(); }
  const exp = expected(pb);

    if (!audio.paused) audio.pause();

    return;
  }

    const p = audio.play();
    if (p && p.catch) p.catch(() => { $('tapToPlay').hidden = false; });
    return;

  if (audio.readyState >= 2 && Math.abs(cur - exp) > 1200 && now() - S.lastSeek > 6000) { audio.currentTime = (exp + 300) / 1000; S.lastSeek = now(); }

/* 音量：iPhone 的网页调不了（只能用侧面的音量键），能调的手机按设置来；睡眠定时最后 30 秒慢慢变小（和安卓一样） */
const VOLUME_OK = (() => { try { const a = document.createElement('audio'); a.volume = 0.5; return Math.abs(a.volume - 0.5) < 0.01; } catch (e) { return false; } })();
S.volume = (() => { const v = parseFloat(store('lt.vol')); return isFinite(v) ? Math.min(1, Math.max(0, v)) : 1; })();
function applyVolume() {
  if (!VOLUME_OK) return;
  const pb = S.playback; let fade = 1;
  if (pb && pb.sleepAt > 0 && !pb.paused) { const h = hostNow(); if (h !== null) fade = Math.min(1, Math.max(0, (pb.sleepAt - h) / 30000)); }

setInterval(() => { try { syncPlayer(); applyVolume(); renderProgress(); renderLyrics(); renderFullLyrics(); updateMediaPosition(); } catch (e) {} }, 250);
setInterval(() => { try { renderSleep(); renderTop(); renderNet(); } catch (e) {} }, 1000);
// 网络慢、在缓冲：显示“缓冲中…”
S.buffering = false;
['waiting', 'stalled'].forEach(ev => audio.addEventListener(ev, () => { S.buffering = true; }));
['playing', 'canplaythrough', 'pause'].forEach(ev => audio.addEventListener(ev, () => { S.buffering = false; }));

  resumedAt = now(); checkAlive(); pingBurst();
  if (S.wakeWanted) requestWake();

/* ---------------- 歌词 ---------------- */
function parseLrc(text) {
  const out = [];
  (text || '').split(/\r?\n/).forEach(line => {
    const tags = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const words = line.replace(/\[[^\]]*\]/g, '').trim();
    tags.forEach(t => out.push({ t: (parseInt(t[1]) * 60 + parseFloat(t[2])) * 1000, s: words }));
  });
  return out.sort((a, b) => a.t - b.t);
}
function parseLyrics(o) {
  const lines = parseLrc(o.lrc).filter(l => l.s);
  const tr = parseLrc(o.translation);
  lines.forEach(l => { const m = tr.find(x => Math.abs(x.t - l.t) < 300 && x.s); if (m) l.tr = m.s; });
  lines.auto = !!o.auto; // 翻译是机器翻的（歌本来没有翻译）
  return lines;
}
/** 现在唱到第几句。 */
function lyricIndex(lines, pos) { let i = lines.findIndex(l => l.t > pos) - 1; if (i < -1) i = lines.length - 1; return Math.max(0, i); }

/* ---------------- 我的网易云：扫码登录自己的账号，看自己的歌单、每日推荐 ----------------
 * 网页连不上网易云（浏览器不让），所以请房主的手机代为调用接口，但用的是你自己的账号。
 * 登录凭证只存在这台手机上；交给房主用的时候装进只有房主能拆的信封（ECDH + AES-GCM，和安卓 SealedBox 一样），
 * 房主用完就丢。不想登录的话，也可以贴自己的主页链接，看公开的歌单。 */
const NE = { view: 'home', req: {}, list: null, filter: '', shown: 200, qr: null, status: '', busy: false, error: '', loaded: false, loginId: '' };
function readJson(k) { try { return JSON.parse(store(k) || 'null'); } catch (e) { return null; } }
function neAccount() { return readJson('lt.neAcct'); } // { cookie, nickname, uid }
function hostMember() { const pb = S.playback, h = pb && S.members[pb.hostId]; return h && !h.web ? h : null; }

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

let sealKeys = null;
async function mySealKeys() {
  if (!sealKeys) {
    const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    sealKeys = { kp, pub: b64(new Uint8Array(await crypto.subtle.exportKey('spki', kp.publicKey))) };
  }
  return sealKeys;
}
async function sealKey(peerPub) {
  const { kp } = await mySealKeys();
  const peer = await crypto.subtle.importKey('spki', unb64(peerPub), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
  const shared = new Uint8Array(await crypto.subtle.deriveBits({ name: 'ECDH', public: peer }, kp.privateKey, 256));
  const digest = await crypto.subtle.digest('SHA-256', concat(shared, te.encode('ltapp-seal-v1')));
  return crypto.subtle.importKey('raw', digest, 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function seal(peerPub, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return b64(concat(iv, new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await sealKey(peerPub), te.encode(text)))));
}
async function unseal(peerPub, box) {
  try { const d = unb64(box); return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, await sealKey(peerPub), d.slice(12))); }
  catch (e) { return null; }
}

/** 请房主办一件事，等 TA 回复（按请求号对上）。 */
function hostAsk(msg, hostPub) {
  const id = rand(8);
  return new Promise((resolve, reject) => {
    NE.req[id] = { resolve, host: hostPub || '' };
    bus(Object.assign({ id }, msg));
    setTimeout(() => { if (NE.req[id]) { delete NE.req[id]; reject(new Error('房主那边没有回应：确认 TA 在房间里，App 是最新版')); } }, 20000);
  });
}
async function onHostReply(m) {
  const r = NE.req[m.id]; if (!r) return; delete NE.req[m.id];
  let res; try { res = JSON.parse(m.text || '{}'); } catch (e) { res = { error: '房主的回复看不懂' }; }
  // 安卓那边等于默认值的字段不发：补上
  res = Object.assign({ code: res.error ? -1 : 200, playlists: [], qr: [], total: 0, name: '', nickname: res.owner || '' }, res);
  if (res.box && r.host) res.cookie = await unseal(r.host, res.box);
  res.tracks = m.tracks || [];
  r.resolve(res);
}
/** 用自己的网易云账号办事（op 见安卓 NeRequest）：凭证装进只有房主能拆的信封。 */
async function neRequest(op, arg) {
  const host = hostMember();
  if (!host) throw new Error('房主（安卓手机）不在房间里，等 TA 进来');
  if (!host.pub) throw new Error('房主的 App 需要更新到最新版，才能帮你登录网易云');
  const acct = neAccount(), keys = await mySealKeys();
  const box = op !== 'login' && op !== 'poll' && acct ? await seal(host.pub, acct.cookie) : '';
  return hostAsk({ type: 'ne', text: JSON.stringify({ op, arg: arg || '', pub: keys.pub, box }) }, host.pub);
}

async function neLoadMine() {
  NE.busy = true; NE.error = ''; renderLib();
  try {
    const res = await neRequest('me');
    if (res.code === 301) { neLogout(); NE.error = '网易云登录过期了，重新扫码登录一下'; return; }
    if (res.code !== 200) throw new Error(res.error || '没读到你的歌单');
    const acct = neAccount();
    if (acct) store('lt.neAcct', JSON.stringify(Object.assign(acct, { nickname: res.nickname || acct.nickname, uid: res.uid })));
    store('lt.neLib', JSON.stringify(res.playlists));

}
function neLogout() { store('lt.neAcct', ''); store('lt.neLib', ''); NE.view = 'home'; NE.list = null; renderLib(); }
async function neLogin() {
  const loginId = NE.loginId = rand(6);
  NE.view = 'login'; NE.qr = null; NE.status = '正在获取二维码…'; renderLib();
  const alive = () => NE.loginId === loginId && NE.view === 'login';
  try {
    const res = await neRequest('login');
    if (!alive()) return;
    if (res.code !== 200 || !res.qr.length) throw new Error(res.error || '取不到二维码');
    NE.qr = res.qr; NE.status = '等待扫码…'; renderLib();
    for (let i = 0; i < 90 && alive(); i++) { // 二维码大约 3 分钟有效
      await new Promise(r => setTimeout(r, 2000));
      if (!alive()) return;
      const p = await neRequest('poll', res.key).catch(() => null);
      if (!p || !alive()) continue;
      if (p.code === 802) { NE.status = '已扫码，请在网易云里点「确认登录」'; renderLib(); }
      else if (p.code === 803 && p.cookie) {
        store('lt.neAcct', JSON.stringify({ cookie: p.cookie, nickname: p.nickname || '' }));
        store('lt.nePub', '');
        NE.view = 'home'; NE.qr = null; NE.loaded = true;
        toast('登录成功' + (p.nickname ? '：' + p.nickname : ''));
        neLoadMine();
        return;
      } else if (p.code !== 801) { NE.qr = null; NE.status = p.error || '登录没成功，再试一次'; renderLib(); return; }
    }
    if (alive()) { NE.qr = null; NE.status = '二维码过期了，重新获取一个'; renderLib(); }
  } catch (e) { if (alive()) { NE.qr = null; NE.status = e.message; renderLib(); } }
}

  if (!host) box.append(el('div', 'libmsg', '房主（安卓手机）不在房间里：登录、读歌单要等 TA 进来'));

  if (NE.view === 'login') {
    const card = el('div', 'libcard');
    card.append(el('h4', null, '用网易云 App 扫码登录'));
    if (NE.qr) { const q = el('div'); q.style.cssText = 'display:grid;place-items:center;margin:6px 0 10px'; q.innerHTML = qrSvg(NE.qr); card.append(q); }
    card.append(el('div', 'libmsg', NE.status));
    const ol = el('ol');
    ['打开网易云音乐 App 的「扫一扫」，扫上面的二维码', '只有这一台手机？先截屏，再在「扫一扫」里点「相册」，选这张截图', '在网易云里点「确认登录」']
      .forEach(s => ol.append(el('li', null, s)));
    card.append(ol);
    const row = el('div'); row.style.cssText = 'display:flex;gap:8px';
    if (!NE.qr) { const again = el('button', 'chip', '重新获取二维码'); again.onclick = neLogin; row.append(again); }
    const cancel = el('button', 'chip', '取消'); cancel.onclick = () => { NE.view = 'home'; NE.qr = null; NE.loginId = ''; renderLib(); };
    row.append(cancel); card.append(row);
    card.append(el('div', 'note', '登录信息只保存在你这台手机上；读歌单时加密交给房主的手机代为请求，房间里别人看不到，用完就丢。'));
    scroll.append(card); box.append(scroll); return;
  }

  if (NE.view === 'list' && NE.list) {
    const L = NE.list, head = el('div', 'libhead');
    const back = el('button', 'back'); back.innerHTML = svg('back'); back.setAttribute('aria-label', '返回歌单');
    back.onclick = () => { NE.view = 'home'; NE.list = null; renderLib(); };
    const title = el('div', 'grow', L.p.name);
    if (L.tracks) title.append(el('small', null, L.total > L.tracks.length ? '共 ' + L.total + ' 首，显示前 ' + L.tracks.length + ' 首' : L.tracks.length + ' 首'));
    head.append(back, title);
    if (L.tracks && L.tracks.length) {
      const all = el('button', 'chip', '全部加入'); all.style.cssText = 'background:var(--rose-deep);color:#fff';
      all.onclick = () => {
        if (L.tracks.length > 30 && !confirm('把 ' + L.tracks.length + ' 首都加入播放列表？')) return;
        cmd('add', { tracks: L.tracks.map(stamp) }); toast('已加入 ' + L.tracks.length + ' 首');
      };
      head.append(all);
    }
    box.append(head);
    if (L.error) box.append(el('div', 'libmsg', L.error));
    if (!L.tracks) { if (!L.error) scroll.append(el('div', 'empty', '正在请房主那边读取…')); box.append(scroll); return; }
    const filter = el('div', 'inputrow'); const fin = el('input'); fin.placeholder = '在这个歌单里找…'; fin.value = NE.filter; fin.enterKeyHint = 'search';
    fin.oninput = () => { NE.filter = fin.value.trim().toLowerCase(); NE.shown = 200; renderLibRows(); };
    filter.append(fin); box.append(filter);
    const rows = el('div', 'scroll'); rows.id = 'libRows'; box.append(rows);
    renderLibRows(); return;
  }

  // 首页：登录了就是自己的歌单；没登录可以扫码登录，或者贴主页链接看公开歌单
  if (acct) {
    const head = el('div', 'libhead');
    head.append(el('div', 'grow', (acct.nickname || '我') + ' 的网易云'));
    const refresh = el('button', 'chip', NE.busy ? '刷新中…' : '刷新'); refresh.onclick = () => neLoadMine();
    const out = el('button', 'chip', '退出登录'); out.onclick = () => { if (confirm('退出网易云登录？（这台手机上不再保存登录信息）')) neLogout(); };
    head.append(refresh, out); box.append(head);
    if (NE.error) box.append(el('div', 'libmsg', NE.error));
    scroll.append(playlistRow({ daily: true, id: 'daily', name: '每日推荐' }));
    const lists = readJson('lt.neLib') || [];
    lists.forEach(p => scroll.append(playlistRow(p)));
    if (!lists.length) scroll.append(el('div', 'empty', NE.busy ? '正在读取你的歌单…' : '还没有歌单'));
    box.append(scroll); return;
  }
  const pub = readJson('lt.nePub');
  const card = el('div', 'libcard');
  card.append(el('h4', null, '登录你的网易云'));
  card.append(el('div', null, '登录后能看到你自己的歌单（包括「我喜欢的音乐」和私密歌单）、每日推荐，点开就能一起听。'));
  const login = el('button', 'primary', '扫码登录网易云'); login.style.cssText = 'width:100%;margin-top:10px;padding:12px';
  login.onclick = neLogin; card.append(login);
  card.append(el('div', 'note', '登录信息只保存在你这台手机上，房间里别人看不到。'));
  scroll.append(card);
  if (NE.error) scroll.append(el('div', 'libmsg', NE.error));
  if (pub && pub.playlists && pub.playlists.length) {
    const head = el('div', 'libhead');
    head.append(el('div', 'grow', (pub.owner || 'TA') + ' 的公开歌单'));
    const change = el('button', 'chip', '换一个'); change.onclick = () => { store('lt.nePub', ''); renderLib(); };
    head.append(change); scroll.append(head);
    pub.playlists.forEach(p => scroll.append(playlistRow(p)));
  } else {
    const alt = el('div', 'libcard');
    alt.append(el('h4', null, '不想登录？'));
    alt.append(el('div', null, '在网易云 App 里打开自己的个人主页 → 分享 → 复制链接，贴到这里，就能看公开的歌单。'));
    const row = el('div', 'inputrow'); row.style.padding = '8px 0 0';
    const input = el('input'); input.placeholder = '粘贴主页或歌单的分享链接';
    const go = el('button', null, NE.busy ? '读取中…' : '读取');
    go.onclick = () => { const v = input.value.trim(); if (v) publicLoad(v); };
    row.append(input, go); alt.append(row); scroll.append(alt);
  }
  box.append(scroll);
}
function renderLibRows() {
  const rows = $('libRows'), L = NE.list; if (!rows || !L || !L.tracks) return;
  rows.textContent = '';
  const f = NE.filter;
  const match = f ? L.tracks.filter(t => (t.title + ' ' + (t.artist || '') + ' ' + (t.album || '')).toLowerCase().includes(f)) : L.tracks;
  match.slice(0, NE.shown).forEach(t => rows.append(songRow(t)));
  if (!match.length) rows.append(el('div', 'empty', f ? '这个歌单里没找到' : '歌单是空的'));
  if (match.length > NE.shown) {
    const more = el('button', 'chip more', '再显示 ' + Math.min(200, match.length - NE.shown) + ' 首');
    more.onclick = () => { NE.shown += 200; renderLibRows(); }; rows.append(more);
  }
}

/* ---------------- 交互 ---------------- */
$('nick').value = store('lt.nick') || '';
$('code').value = displayCode(new URLSearchParams(location.search).get('room') || store('lt.code') || '');
$('code').addEventListener('input', e => { const n = normalizeCode(e.target.value).slice(0, 8); e.target.value = n.length > 4 ? n.slice(0, 4) + '-' + n.slice(4) : n; });
$('joinBtn').onclick = join;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
$('leaveBtn').onclick = () => { if (confirm('离开房间？')) leave(); };
$('playBtn').onclick = () => { unlockAudio(); const pb = S.playback; cmd(pb && !pb.paused && !pb.loading ? 'pause' : 'play'); };
$('prevBtn').onclick = () => cmd('prev');
$('nextBtn').onclick = () => cmd('next');
$('tapToPlay').onclick = () => { $('tapToPlay').hidden = true; audio.play().catch(() => {}); };
$('heartBtn').onclick = () => { floatHeart('❤️'); bus({ type: 'react', text: '❤️', id: rand(8) }); };
function sendChat() { const v = $('chatInput').value.trim(); if (!v) return; $('chatInput').value = ''; bus({ type: 'chat', text: v.slice(0, 200), id: rand(8) }); }
$('sendBtn').onclick = sendChat;
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
function search() {
  const q = $('searchInput').value.trim(); if (!q) return;
  if (!Object.values(S.members).some(m => !m.web && m.id !== S.myId)) { toast('房间里要有安卓手机才能搜歌'); return; }
  S.searchId = rand(8);
  const list = $('results'); list.textContent = ''; const e = document.createElement('div'); e.className = 'empty'; e.textContent = '正在请房主那边搜索…'; list.append(e);
  bus({ type: 'search', id: S.searchId, key: S.source, text: q });
  rememberSearch(q);
  const id = S.searchId;
  setTimeout(() => { if (S.searchId === id && $('results').querySelector('.empty')) $('results').querySelector('.empty').textContent = '房主那边没有回应，稍后再试'; }, 12000);
}
$('modeBtn').onclick = () => {
  const mode = (S.playback && S.playback.mode) || 'list';
  const next = MODES[(MODES.findIndex(x => x[0] === mode) + 1) % MODES.length];
  cmd('mode', { text: next[0] }); toast(next[2]);
};
$('sleepBtn').onclick = () => { renderSleep(); $('sleepSheet').hidden = false; };
$('sleepSheet').addEventListener('click', e => {
  if (e.target === $('sleepSheet') || e.target.id === 'sleepClose') { $('sleepSheet').hidden = true; return; }
  const b = e.target.closest('button[data-min]'); if (!b) return;
  const min = parseInt(b.dataset.min, 10);
  // 和安卓一样：pos = 毫秒；-1 = 播完这首；0 = 取消
  cmd('sleep', { pos: min > 0 ? min * 60000 : min });
  $('sleepSheet').hidden = true;
  toast(min > 0 ? `${min} 分钟后大家一起停` : min < 0 ? '播完这首就一起停' : '已取消定时');
});
$('turnsBtn').onclick = () => { const on = !(S.playback && S.playback.turns); cmd('turns', { text: on ? '1' : '0' }); toast(on ? '轮流点歌：你一首、我一首' : '已关闭轮流点歌'); };
$('clearBtn').onclick = () => { if (S.queue.length && confirm('清空播放列表？')) cmd('clear'); };
$('undoBtn').onclick = () => {
  if (!S.undo) return;
  // 放回原来的位置（同一首歌，重复点也只会回来一次）
  cmd('add', { tracks: [S.undo.track], index: S.undo.index });
  S.undo = null; $('undoBar').hidden = true;
};
$('lyrics').onclick = openLyrics;
$('heartBtn').addEventListener('click', () => { const h = $('heartBtn'); h.animate && h.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], 260); });
$('lfClose').onclick = () => { $('lyricsFull').hidden = true; };
$('lfTr').onclick = () => { store('lt.tr', store('lt.tr') === '0' ? '1' : '0'); $('lfTr').classList.toggle('on', store('lt.tr') !== '0'); renderFullLyrics(); };
$('searchBtn').onclick = search;
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('srcPick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $('srcPick').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  const mine = b.dataset.src === 'mine';
  $('searchBox').hidden = mine; $('libBox').hidden = !mine;
  if (mine) openLibrary(); else S.source = b.dataset.src;
});
function selectTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button[data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  document.querySelectorAll('.page[data-page]').forEach(p => p.hidden = p.dataset.page !== tab);
  if (tab === 'chat') { $('chatDot').hidden = true; const l = $('chatList'); l.scrollTop = l.scrollHeight; }
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (b) selectTab(b.dataset.tab);
});
$('expandBtn').onclick = () => setExpanded(!$('room').classList.contains('expanded'));
$('queueBtn').onclick = () => { selectTab('queue'); setExpanded(true); };
$('lyricsBtn').onclick = openLyrics;
$('miniPlay').onclick = () => $('playBtn').onclick();
$('miniNext').onclick = () => cmd('next');
// 邀请：发链接（带房间码），点开就能进来
$('inviteBtn').onclick = async () => {
  const code = displayCode(S.code), url = location.origin + location.pathname + '?room=' + code;
  const text = `来「一起听看」和我一起听歌，房间码 ${code}`;
  if (navigator.share) { try { await navigator.share({ title: '一起听', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text + '\n' + url); toast('邀请链接已复制，发给 TA 就行'); } catch (e) { toast('房间码：' + code); }
};

/* ---------------- 设置：音量、歌词翻译、保持亮屏、网络 ---------------- */
let wakeLock = null;
S.wakeWanted = store('lt.wake') === '1';
async function requestWake() {
  if (!('wakeLock' in navigator) || wakeLock) return !!wakeLock;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); return true; } catch (e) { return false; }
}
function renderNet() {
  const el = $('netInfo'), c = S.mqtt; if (!el) return;
  if (!c) { el.textContent = '还没连接'; return; }
  if (reconnecting || !c.connected) { el.textContent = '正在重新连接…'; return; }
  const best = S.clock.samples.length ? Math.round(Math.min(...S.clock.samples.map(s => s.rtt))) : null;
  el.textContent = S.ep.label + (best !== null ? ` · 和房主往返 ${best} 毫秒` : '');
}
$('settingsBtn').onclick = () => {
  $('volRow').hidden = !VOLUME_OK; $('volHint').hidden = VOLUME_OK;
  $('volume').value = Math.round(S.volume * 100);
  $('trToggle').checked = store('lt.tr') !== '0';
  $('wakeRow').hidden = !('wakeLock' in navigator);
  $('wakeToggle').checked = S.wakeWanted;
  renderNet();
  $('setSheet').hidden = false;
};
$('setSheet').addEventListener('click', e => { if (e.target === $('setSheet') || e.target.id === 'setClose') $('setSheet').hidden = true; });
$('volume').addEventListener('input', e => { S.volume = e.target.value / 100; store('lt.vol', String(S.volume)); applyVolume(); });
$('trToggle').onchange = e => {
  store('lt.tr', e.target.checked ? '1' : '0'); $('lfTr').classList.toggle('on', e.target.checked);
  $('lyrics').dataset.k = ''; renderLyrics(); lfKey = ''; renderFullLyrics();
};
$('wakeToggle').onchange = async e => {
  S.wakeWanted = e.target.checked; store('lt.wake', S.wakeWanted ? '1' : '0');
  if (S.wakeWanted) { if (!await requestWake()) { S.wakeWanted = false; e.target.checked = false; store('lt.wake', '0'); toast('这台手机暂时不支持保持亮屏'); } }
  else if (wakeLock) { try { wakeLock.release(); } catch (er) {} wakeLock = null; }
};
// 手动重新连接：同一集群的入口重新比一次，用最快的
$('reconnectBtn').onclick = () => { const c = S.mqtt; if (!c) return; toast('正在重新连接…'); if (c.connected) c.kill(); else checkAlive(); };
// 拖进度条：松手才跳（大家一起跳）
(() => {
  const bar = $('bar');
  const frac = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  bar.addEventListener('pointerdown', e => { if (!S.playback || !S.playback.track) return; bar.setPointerCapture(e.pointerId); dragFrac = frac(e); renderProgress(); });
  bar.addEventListener('pointermove', e => { if (dragFrac !== null) { dragFrac = frac(e); renderProgress(); } });
  bar.addEventListener('pointerup', e => { if (dragFrac === null) return; const d = duration(); if (d > 0) cmd('seek', { pos: Math.round(dragFrac * d) }); dragFrac = null; });
  bar.addEventListener('pointercancel', () => { dragFrac = null; });
})();
window.addEventListener('pagehide', () => { if (S.mqtt && !S.leaving) try { S.mqtt.publish(S.base + '/m/' + S.myId, new Uint8Array(0), { qos: 1, retain: true }); } catch (e) {} });
// 离线缓存（见 sw.js）：只在 https 网址或本机调试时启用
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
